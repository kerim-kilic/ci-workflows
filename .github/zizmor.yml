# zizmor configuration (read automatically from .github/zizmor.yml).
rules:
  unpinned-uses:
    config:
      policies:
        # Actions from GitHub and HashiCorp stay on major tags (a deliberate choice; Dependabot keeps them current).
        # Any other publisher's action must be pinned to a full commit SHA.
        "actions/*": ref-pin
        "hashicorp/*": ref-pin
        "*": hash-pin
  # The self-test calls this repository's workflows by local path (./.github/...). zizmor suggests the newer
  # self-repository syntax ($/...), but actionlint 1.7.12 rejects it. Revisit when actionlint supports it.
  self-repository:
    disable: true
